<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>El microcosmos de nuestro amor ✨</title>

  <style>
    :root{
      --bg0:#070A12;
      --bg1:#0B1230;

      --paper:#F6F2E9;
      --paper2:#FFFDF8;
      --ink:#0B0F1A;

      --radius: 22px;
      --bookW: min(420px, 92vw);
      --bookH: 760px;

      --ease: cubic-bezier(.2,.8,.2,1);
      --flipMs: 820ms;

      --accentA: #FF4D6D;
      --accentB: #7C5CFF;
      --accentC: #3CE5D2;

      --spaceSubtitle: 10px;
      --spaceText: 14px;
    }

    body{
      margin:0;
      min-height: 100dvh;
      height: auto;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      padding: 14px 0 40px;
      color: rgba(255,255,255,.92);
      background:
        radial-gradient(1200px 800px at 10% 10%, rgba(124,92,255,.18), transparent 55%),
        radial-gradient(900px 600px at 90% 15%, rgba(60,229,210,.14), transparent 55%),
        radial-gradient(1000px 700px at 50% 90%, rgba(255,77,109,.16), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      overflow-x:hidden;
      overflow-y:auto;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }

    body::before{
      content:"";
      position:fixed; inset:-40px;
      background:
        radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,.65), transparent 55%),
        radial-gradient(1px 1px at 80% 30%, rgba(255,255,255,.55), transparent 55%),
        radial-gradient(1px 1px at 25% 75%, rgba(255,255,255,.45), transparent 55%),
        radial-gradient(1px 1px at 55% 45%, rgba(255,255,255,.5), transparent 55%),
        radial-gradient(1.2px 1.2px at 70% 85%, rgba(255,255,255,.35), transparent 55%);
      opacity:.45;
      pointer-events:none;
      transform: translateZ(0);
    }

    .app{
      width: min(980px, 96vw);
      padding: 16px 12px 24px;
    }

    .topbar{
      display:flex;
      gap: 14px;
      align-items:center;
      justify-content:space-between;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .brand{
      display:flex;
      align-items:center;
      gap: 12px;
      user-select:none;
      max-width: 520px;
    }
    .logo{
      width: 40px; height: 40px;
      border-radius: 14px;
      background:
        radial-gradient(18px 18px at 30% 30%, rgba(255,255,255,.7), transparent 55%),
        linear-gradient(135deg, rgba(255,77,109,.95), rgba(124,92,255,.95), rgba(60,229,210,.9));
      box-shadow: 0 14px 40px rgba(124,92,255,.25), 0 12px 30px rgba(0,0,0,.25);
      position:relative;
      overflow:hidden;
      flex: 0 0 auto;
    }
    .logo::after{
      content:"";
      position:absolute; inset:-40px;
      background: linear-gradient(135deg, transparent, rgba(255,255,255,.25), transparent);
      transform: rotate(20deg);
      animation: shine 5.8s var(--ease) infinite;
    }
    @keyframes shine{
      0%{ transform: translateX(-40%) rotate(20deg); opacity:.0; }
      18%{ opacity:.55; }
      40%{ transform: translateX(55%) rotate(20deg); opacity:.0; }
      100%{ transform: translateX(55%) rotate(20deg); opacity:0; }
    }

    .brand h1{
      margin:0;
      font-size: 17px;
      letter-spacing:.2px;
      font-weight: 850;
      line-height:1.05;
    }
    .brand p{
      margin:3px 0 0;
      opacity:.78;
      font-size: 12.5px;
      line-height: 1.25;
    }

    .controls{
      display:flex;
      gap: 10px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .pill{
      display:flex;
      align-items:center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 25px rgba(0,0,0,.22);
      user-select:none;
    }
    .dot{
      width: 7px; height: 7px; border-radius:50%;
      background: rgba(255,255,255,.55);
      box-shadow: 0 0 0 4px rgba(255,255,255,.10);
    }
    .meta{
      font-size: 12.5px;
      opacity: .9;
      white-space:nowrap;
    }

    button{
      appearance:none;
      border:0;
      padding: 10px 14px;
      border-radius: 12px;
      color: rgba(255,255,255,.94);
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.16);
      cursor:pointer;
      transition: transform 180ms var(--ease), background 180ms var(--ease), border-color 180ms var(--ease);
      box-shadow: 0 10px 25px rgba(0,0,0,.22);
      font-weight: 750;
      letter-spacing:.2px;
    }
    button:hover{ transform: translateY(-1px); background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.22); }
    button:active{ transform: translateY(0); }
    button:disabled{ opacity:.45; cursor:not-allowed; transform:none; }

    /* ✨ Botón especial "Viajar al final" */
    #endBtn{
      background: linear-gradient(135deg, rgba(255,77,109,.35), rgba(124,92,255,.35));
      border-color: rgba(255,77,109,.45);
    }
    #endBtn:hover:not(:disabled){
      background: linear-gradient(135deg, rgba(255,77,109,.50), rgba(124,92,255,.50));
      border-color: rgba(255,77,109,.65);
    }

    .stage{
      position:relative;
      width: 100%;
      display:grid;
      place-items:center;
      padding: 6px 0 0;
    }

    .hint{
      margin-top: 10px;
      font-size: 12px;
      opacity: .75;
      display:flex;
      gap: 8px;
      align-items:center;
      user-select:none;
      justify-content:center;
    }
    .kbd{
      font-size: 11px;
      padding: 4px 7px;
      border-radius: 8px;
      background: rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.16);
    }

    /* ---------- Libro (paso de página con física de papel) ---------- */
    .book-host{
      width: var(--bookW);
      margin: 0 auto;
      filter: drop-shadow(0 28px 60px rgba(0,0,0,.5));
    }
    .book{ margin: 0 auto; }

    .page{
      background: linear-gradient(180deg, var(--paper2), var(--paper));
      color: var(--ink);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border-radius: 6px;
      box-shadow: inset 10px 0 18px -14px rgba(0,0,0,.35); /* lomo del libro */
    }
    .page .pane{ height: 100%; box-sizing: border-box; }

    /* Firma opcional al final de una página (campo "firma") */
    .firma{
      margin: 18px 0 0;
      font-size: 15.2px;
      line-height: 1.6;
      font-style: italic;
      font-weight: 650;
      text-align: right;
      color: rgba(10,12,18,.9);
    }

    /* Reverso de la hoja mientras se pasa: papel en blanco */
    .page.reverso{
      background: linear-gradient(90deg, #EEE8DA, var(--paper2) 55%, #F4EFE4);
      box-shadow: none;
    }
    .page.reverso > *{ visibility: hidden; }

    .book-host{ touch-action: pan-y; user-select: none; -webkit-user-select: none; }

    /* Mientras se mide el alto de las páginas */
    .measure .page{ height: auto; }

    .pane{
      padding: 18px;
      display:flex;
      flex-direction:column;
      gap: 12px;
      min-height: 100%;
      position:relative;
    }

    .hero{
      height: 320px;
      border-radius: 18px;
      overflow:hidden;
      position:relative;
      background: rgba(0,0,0,.06);
      box-shadow: 0 16px 40px rgba(0,0,0,.12);
      flex: 0 0 auto;
    }
    .hero img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
      transform: scale(1.02);
      transition: transform 650ms var(--ease);
    }
    .page:hover .hero img{ transform: scale(1.04); }

    .hero::after{
      content:"";
      position:absolute; inset:0;
      background:
        linear-gradient(180deg, transparent 40%, rgba(0,0,0,.30)),
        radial-gradient(60% 45% at 70% 20%, rgba(255,255,255,.22), transparent 60%);
      pointer-events:none;
    }

    .tag{
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing:.35px;
      text-transform: uppercase;
      color: rgba(255,255,255,.94);
      background: linear-gradient(135deg, rgba(99, 3, 126, 0.95), rgba(156, 131, 255, 0.85));
      padding: 9px 11px;
      border-radius: 999px;
      box-shadow: 0 16px 36px rgba(124,92,255,.22);
      width: fit-content;
      position:absolute;
      left: 16px;
      top: 16px;
      z-index: 2;
    }
    .tag .spark{
      width: 9px; height: 9px; border-radius: 50%;
      background: rgba(255,255,255,.85);
      box-shadow: 0 0 0 6px rgba(255,255,255,.14);
    }

    .copy{
      text-align: justify;
      text-justify: inter-word;
      hyphens: auto;
      overflow-wrap: break-word;
    }

    .title{
      margin: 0;
      font-size: 24px;
      line-height: 1.08;
      letter-spacing: .1px;
      font-weight: 900;
      text-align: left;
    }

    .subtitle{
      margin: var(--spaceSubtitle) 0 0;
      font-size: 13.5px;
      opacity: .72;
      line-height: 1.35;
    }
    .text{
      margin: var(--spaceText) 0 0;
      font-size: 15.2px;
      line-height: 1.68;
      color: rgba(10,12,18,.88);
    }

    .footer{
      margin-top:auto;
      display:flex;
      justify-content:flex-end;
      align-items:center;
      padding-top: 6px;
    }
    .pnum{
      font-size: 12px;
      color: rgba(10,12,18,.55);
      font-weight: 850;
      letter-spacing:.2px;
    }

    .cover{
      background:
        radial-gradient(900px 600px at 30% 20%, rgba(124,92,255,.22), transparent 60%),
        radial-gradient(900px 600px at 80% 60%, rgba(60,229,210,.18), transparent 60%),
        linear-gradient(135deg, rgba(255,77,109,.22), rgba(255,255,255,.0) 40%),
        linear-gradient(180deg, #11142B, #090B17);
      color: rgba(255,255,255,.92);
    }
    .cover .text{ color: rgba(255,255,255,.82); }
    .cover .pnum{ color: rgba(255,255,255,.75); }

    @media (prefers-reduced-motion: reduce){
      .logo::after{ animation:none; }
      .page:hover .hero img{ transform:none; }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div>
          <h1>El microcosmos de nuestro amor ✨</h1>
          <p>Todo por ti princesa amada ✦ desliza o usa ← →</p>
        </div>
      </div>

      <div class="controls">
        <div class="pill" title="Estado del libro">
          <span class="dot" aria-hidden="true"></span>
          <div class="meta" id="statusText">Página 1 / 1</div>
        </div>
        <button id="prevBtn" type="button" aria-label="Página anterior">← Atrás</button>
        <button id="endBtn" type="button" aria-label="Ir a la última página">✨ Viajar al final</button>
        <button id="nextBtn" type="button" aria-label="Página siguiente">Siguiente →</button>
      </div>
    </div>

    <div class="stage">
      <div class="book-host" id="bookHost"></div>

      <div class="hint">
        <span class="kbd">←</span><span class="kbd">→</span>
        <span>o arrastra la esquina de la hoja</span>
      </div>
    </div>
  </div>

  <script src="js/vendor/page-flip.browser.js"></script>
  <script>
    const PAGES = [
      {
        kind: "cover",
        tag: "Había una vez...",
        title: "Nuestro microcosmos, en forma de librito ✨",
        subtitle: "Porque el amor que siento por ti no cabe en mí.",
        text: "Me gusta descubrir nuevas maneras de decirte 'te amo' sin repetir las mismas palabras. Te amo cada vez que te cuento cuentos, te amo cada vez que nos tomamos de la mano, te amo cada vez que sonríes, te amo ayer, te amo hoy y te amaré mañana simplemente porque amo tu existencia. Y hoy, con todo lo que siento por ti, decidí crear un espacio donde el mundo pueda ver un pedacito de nuestro microcosmos.",
        image: "images/amarte.jpeg"
      },
      { tag: "", title: "", subtitle: "", text: "", image: "" },

      {
        tag: "Gracias bebé",
        title: "Tu existencia es un regalo",
        subtitle: "El amor más bonito que haya existido",
        text: "Tu compañía durante este tiempo ha sido sin duda alguna, una de las experiencias más enriquecedoras de mi vida, porque no solo disfrutamos, también aprendemos y crecemos. Hemos dedicado tiempo a mejorar por nosotros mismos y por nuestro amor. Y hoy amor mío, ese amor quiero tratarlo con delicadeza, protegerlo con mi alma y alimentarlo con nuevas experiencias juntitos. Y sin duda, te agradezco todo lo que haces por mí, por ayudarme en momentos de vulnerabilidad, por tener ganas de disfrutar la vida conmigo y por ser tú misma. Gracias por lo que eres, gracias por ser el amor más bonito que existe.",
        image: "images/juntos.jpeg"
      },
      { tag: "", title: "", subtitle: "", text: "", image: "" },

      {
        tag: "Nuestra primera cita",
        title: "El inicio de nuestro sempiterno",
        subtitle: "Nuestra historia no se lee: se recorre",
        text: "Hace cuatro meses exactamente, un 14 de octubre tuvimos nuestra primera cita, aquella en la que llegaba con nervios y sin imaginar cómo escalaría nuestra historia, una breve cita en una cafetería y luego en un bar de vacas. Fueron nuestras primeras risas juntos, la primera vez que nos sentamos uno al lado del otro y la primera que vez que nos abrazamos, abrazo que se convirtió en un conjunto de muchísimos abrazos, los que guardo con cariño en mis recuerdos. Éramos dos personas compartiendo un instante de nuestras vidas, un instante que poco a poco se transformará en nuestro sempiterno.",
        image: "images/cita.jpeg"
      },
      { tag: "", title: "", subtitle: "", text: "", image: "" },

      {
        tag: "¿Por qué tú?",
        title: "Sé mi mujer, sé mi vida",
        subtitle: "No eres impulso, eres mi elección",
        text: "Me haces sentir en casa, me inspiras, y creo en lo que podemos ser. Te elijo con conciencia, con ganas de cuidarnos y de hacer que esto sea sano porque no solo me gustas, también te admiro, admiro tu inteligencia, tu forma de ver el mundo, tu corazón y tu fuerza. Tienes un brillo único que quiero abrazar toda mi vida, tienes un alma que quiero adornar con mis besos. Y sí… en mi corazón siento que te amo cada día más. Quiero todo contigo amor mío y sé que podemos con todo, porque lo inexistente es lo que no hemos deseado lo suficiente.",
        image: "images/futuro.jpeg"
      },
      { tag: "", title: "", subtitle: "", text: "", image: "" },

      {
        tag: "Por siempre",
        title: "Nuestro amor es fascinante",
        subtitle: "Y te volvería a elegir como mi amada",
        text: "Quiero cuidarte mejor, escucharte de verdad y demostrarte lo importante que eres para mí. Estoy aprendiendo, y voy a tomar cada oportunidad para mejorar y no descansaré hasta ser el hombre de tus sueños y hacer de nuestra relación un espacio seguro. Empecé a volverme loco por ti desde aquella vez que nos dimos un abrazo en el Zacha que fue tan largo como Wonderwall de fondo y me di cuenta del enorme cariño que sentía cuando llevaba tu librito de copiloto para el primer capítulo de Navidad de Marcia chiquita. Desde ese momento te quiero y quiero seguir construyendo mi vida contigo.",
        image: "images/cuidarte.jpeg"
      },
      { tag: "", title: "", subtitle: "", text: "", image: "" },

      {
        tag: "Feliz 14 de Febrero",
        title: "Hoy es el día 146 (par)",
        subtitle: "Y quiero sumar infinitos días a tu lado",
        text: "Te amo con el alma mi vida y quería darte un regalo que pudieses llevar a todos lados, para que puedas recordar el gran amor que te tengo en cualquier momento de tu vida. Espero que este día sea de tu agrado, porque tengo muchas aventuras preparadas para nosotros y me encanta poder planificar nuevas actividades para coleccionar juntitos, porque la vida ilumina más a través de tus ojos. Celebraremos este día, pero me preocuparé de que todos nuestros días sean el día del amor. Buen día amor de mi vida.",
        image: "images/beso2.jpeg"
      },
      { tag: "", title: "", subtitle: "", text: "", image: "" },

      {
        tag: "Explosión de Amor",
        title: "Porque el te amo ya no es suficiente",
        subtitle: "Tengo ganas de ti",
        text: "Hoy estamos lejos, una gran distancia nos separa, sin embargo, nuestro amor se siente más fuerte. Cada minuto que pasa hace que te extrañe más y tanto fue nuestra explosión de amor, que rompimos insta con nuestra forma tan pegote y preciosa de ser. Amo sentir que quiero teletransportarme a tu lado y haré todo lo posible por entregarte una vida de ternura y pasión. Una vida en la que nos vayamos a dormir juntos todos los días, una vida en la que le cuentas a todo el mundo lo precioso que es tu anillo de promesa, porque estoy tan enamorado que un noviazgo no es suficiente.",
        image: "images/beso.jpeg"
      },
      { tag: "", title: "", subtitle: "", text: "", image: "" },

      {
        tag: "¿Nuestra foto favorita?",
        title: "Nuestro sempiterno",
        subtitle: "Un amor que no es estático, un amor que tiene vida",
        text: "Cada vez que pienso que ya no es posible vivir una cita más bonita de lo maravilloso que hemos experimentado, llega un nuevo día a tu lado y vuelvo a enamorarme de lo nuestro con una intensidad distinta. Cuando creo que ya tenemos la foto más hermosa, aparecemos otra vez sorprendiéndonos con una nueva que guarda algo aún más nuestro, más vivo, más mágico. Y eso es lo que más me fascina de amarte, que contigo la belleza nunca se acaba, solo se transforma, crece y encuentra nuevas formas de dejarme sin aliento. Siempre hay una ternura nueva (como tus formas de hacerme nanai), un recuerdo nuevo, una versión más preciosa de nuestro sempiterno esperándonos justo después de la anterior.",
        image: "images/sempiterno.jpeg"
      },
      { tag: "", title: "", subtitle: "", text: "", image: "" },

      {
        tag: "Significas todo para mi",
        title: "Eres mi lugar seguro",
        subtitle: "Mi amor, mi hogar",
        text: "Eres la persona en quien más confío en todo el mundo, y eso para mí lo significa todo. Me encanta sentir que no solo eres mi novia, sino también mi mejor amiga, con quien puedo compartir cada pensamiento, cada risa y también mis momentos más vulnerables. Siento una conexión tan real que me hace querer seguir construyendo algo cada día más lindo. Que preciosa eres mi vida, adoro sentirte, vestirnos igualitos y que lindo es conocer el tierno sonidito que generan nuestros besitos. Tengo muchas ganas de que sigamos creciendo juntitos, de acompañarnos en todo, porque no imagino un futuro que no sea contigo a mi lado.",

      },
      { tag: "", title: "", subtitle: "", text: "", image: "" },

      {

        subtitle: "Después de la tormenta sale el sol",
        text: "Hemos atravesado momentos complejos, pero cada dificultad nos ha enseñado a entendernos mejor, a expresar nuestras inseguridades de mejor manera, valorar nuestros abrazos y a descubrir cuánto amor existe realmente entre nosotros. Deseo que sigamos aprendiendo, creciendo y tratando de construir algo más bonito que ayer. No sé cuántas historias nos faltan por escribir, pero me emociona pensar en vivir todo a tu lado y crear juntos un espacio donde puedan descansar nuestros corazones. Eres mi concepto de hogar y lo seguirás siendo aquel día que estemos comiendo mandarinas sentados en nuestro jardín bajo nuestro farolito del amor.",
        image: "images/columpio.jpeg"
      },
      { tag: "", title: "", subtitle: "", text: "", image: "" },

      {
        tag: "Un futuro tranquilo",
        title: "Me haces bien",
        subtitle: "Avanzando juntitos",
        text: "Es increíble lo complejo que es describir todo lo que provocas en mí, tantas emociones y sonrisas. Te amo y deseo cuidarte con todo el corazón, mientras avanzamos juntitos, superando hitos, mejorando tomados de la manito, mientras damos pasitos. No puedo ver el futuro, pero en tus ojos veo todo tranquilo, donde ambos compartimos mucho más que la vida, compartimos el alma. Agradezco sumar recuerdos juntitos, ser parte de tus logros y deseo seguir viendo como el amor de mi vida avanza hacía su futuro porque sé que pase lo que pase, siempre serás tú, en esta vida y en todas las que vienen. Gracias por hacerme sentir como un niño sin miedo al mañana.",
        image: "images/tranquilidad.jpeg"

      { tag: "", title: "", subtitle: "", text: "", image: "" },

      {

      },
      { tag: "", title: "", subtitle: "", text: "", image: "" },

      {

      },
      { tag: "", title: "", subtitle: "", text: "", image: "" },

      {
        tag: "16 de noviembre",
        title: "Feliz cumpleaños, amor mío 🎂",
        subtitle: "Gracias por permitirme celebrarte un día más",
        text: "Hoy es un día para celebrar que existes, que llegaste a este mundo y que, de alguna manera tan bonita e inesperada, nuestros caminos terminaron encontrándose. Quiero que sepas que tu existencia es motivo de alegría, no solamente para quienes tienen la suerte de conocerte, sino también para mí, que tengo el enorme privilegio de compartir contigo taaaantos pedacitos de mi vida (y todos los que se vienen). Me encanta verte feliz, escucharte reír, descubrir tus ocurrencias, compartir tus aventuras y hasta esos momentos pequeñitos que quizás parecen insignificantes, pero que terminan convirtiéndose en mis recuerdos favoritos.",
        firma: "Feliz cumpleaños amor mío, GRACIAS por aceptar aquella primera cita.",
        image: "images/cumple.jpeg"
      },
    ];

    

    // Solo páginas con contenido (las hojas en blanco ya no son necesarias)
    const PAGINAS = PAGES.filter((p) => p && (p.title || p.text || p.image));

    const host = document.getElementById("bookHost");
    const statusText = document.getElementById("statusText");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const endBtn = document.getElementById("endBtn");

    const FLIP_MS = 1100;       // duración base del paso de página (la librería la acorta según el tamaño)
    const FLIP_VIAJE_MS = 380;  // duración durante "Viajar al final"

    let libro = null;
    let bloque = null;
    let anchoActual = 0;
    let paginaActual = 0;
    let viajando = false;

    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function hasImage(src) {
      return typeof src === "string" && src.trim().length > 0;
    }

    function makeInner(page, pageNumber) {
      const tag = escapeHtml(page?.tag ?? "");
      const title = escapeHtml(page?.title ?? "");
      const subtitle = escapeHtml(page?.subtitle ?? "");
      const text = escapeHtml(page?.text ?? "");
      const firma = escapeHtml(page?.firma ?? "");
      const image = page?.image ?? "";
      const firmaHtml = firma ? `<p class="firma">${firma}</p>` : "";
      const tagHtml = tag ? `<div class="tag"><span class="spark"></span>${tag}</div>` : "";
      const heroHtml = hasImage(image)
        ? `<div class="hero" aria-hidden="true"><img decoding="async" src="${image}" alt="" draggable="false"></div>`
        : "";

      return `
        <div class="pane">
          <div style="position:relative;">
            ${tagHtml}
            ${heroHtml}
          </div>
          <div class="copy">
            <h2 class="title">${title}</h2>
            <p class="subtitle">${subtitle}</p>
            <p class="text">${text}</p>
            ${firmaHtml}
          </div>
          <div class="footer">
            <span class="pnum">${pageNumber}</span>
          </div>
        </div>
      `;
    }

    function crearPagina(page, i) {
      const el = document.createElement("div");
      el.className = "page" + (page.kind === "cover" ? " cover" : "");
      el.innerHTML = makeInner(page, i + 1);
      return el;
    }

    function anchoLibro() {
      return Math.round(Math.min(420, window.innerWidth * 0.92));
    }

    // Alto del libro = alto de la página más larga a este ancho
    function altoLibro(w) {
      const medidor = document.createElement("div");
      medidor.className = "measure";
      medidor.style.cssText = `position:absolute;left:-10000px;top:0;width:${w}px;visibility:hidden;pointer-events:none;`;
      document.body.appendChild(medidor);
      let max = 0;
      PAGINAS.forEach((p, i) => {
        const el = crearPagina(p, i);
        medidor.appendChild(el);
        max = Math.max(max, el.offsetHeight);
      });
      medidor.remove();
      return Math.max(520, Math.ceil(max) + 4);
    }

    function construirLibro() {
      const w = anchoLibro();
      if (libro && w === anchoActual) return;
      anchoActual = w;

      if (libro) {
        paginaActual = libro.getCurrentPageIndex();
        libro.destroy();
      }

      const h = altoLibro(w);
      host.style.width = w + "px";

      const el = document.createElement("div");
      el.className = "book";
      host.appendChild(el);

      libro = new St.PageFlip(el, {
        width: w,
        height: h,
        size: "fixed",
        autoSize: true,
        usePortrait: true,        // una página a la vez
        showCover: false,
        drawShadow: true,
        maxShadowOpacity: 0.45,
        flippingTime: FLIP_MS,
        showPageCorners: true,    // la esquina se levanta al pasar el mouse
        disableFlipByClick: true, // tocar el texto no pasa la página
        mobileScrollSupport: true,
        useMouseEvents: false,    // los gestos los maneja este archivo (ver "Gestos")
        startPage: paginaActual,
      });
      libro.loadFromHTML(PAGINAS.map(crearPagina));
      bloque = el.querySelector(".stf__block");

      // La parte que se dobla al pasar la hoja es una copia de la página:
      // se marca como "reverso" para que se vea como papel en blanco.
      new MutationObserver((cambios) => {
        for (const c of cambios)
          for (const n of c.addedNodes)
            if (n.classList && n.classList.contains("page")) n.classList.add("reverso");
      }).observe(bloque, { childList: true });

      libro.on("flip", (e) => {
        paginaActual = e.data;
        actualizarUi();
      });
      libro.on("changeState", (e) => {
        if (e.data === "read" && viajando) seguirViaje();
        actualizarUi();
      });

      actualizarUi();
    }

    function actualizarUi() {
      const total = PAGINAS.length;
      const enFinal = paginaActual >= total - 1;
      statusText.textContent = `Página ${paginaActual + 1} / ${total}`;
      prevBtn.disabled = paginaActual === 0 || viajando;
      nextBtn.disabled = enFinal || viajando;
      endBtn.disabled = enFinal || viajando;
      endBtn.style.display = enFinal ? "none" : "";
    }

    // La librería trata los botones como un "clic" en la hoja; se habilita solo durante la llamada
    function pasar(fn) {
      const s = libro.getSettings();
      s.disableFlipByClick = false;
      fn("top");
      s.disableFlipByClick = true;
    }
    function siguiente() { if (!viajando && !enFinal()) pasar((c) => libro.flipNext(c)); }
    function anterior()  { if (!viajando && paginaActual > 0) pasar((c) => libro.flipPrev(c)); }
    function enFinal()   { return paginaActual >= PAGINAS.length - 1; }

    // ✨ Pasa todas las páginas rápido hasta la última
    function irAlFinal() {
      if (viajando || paginaActual >= PAGINAS.length - 1) return;
      viajando = true;
      libro.getSettings().flippingTime = FLIP_VIAJE_MS;
      actualizarUi();
      libro.flipNext("top");
    }

    function seguirViaje() {
      if (paginaActual >= PAGINAS.length - 1) {
        viajando = false;
        libro.getSettings().flippingTime = FLIP_MS;
        actualizarUi();
        return;
      }
      setTimeout(() => libro.flipNext("top"), 40);
    }

    // ---------- Gestos (dedo / mouse) ----------
    // La dirección depende de hacia dónde se arrastra, no de dónde se toca.
    // Arrastrar a la izquierda = siguiente (se toma la esquina derecha),
    // arrastrar a la derecha = anterior (se toma el borde izquierdo).
    let gesto = null;

    function posEnBloque(e) {
      const r = bloque.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }

    host.addEventListener("pointerdown", (e) => {
      if (viajando || (e.pointerType === "mouse" && e.button !== 0)) return;
      const estado = libro.getState();
      if (estado !== "read" && estado !== "fold_corner") return;
      const p = posEnBloque(e);
      gesto = { x0: e.clientX, y0: e.clientY, t0: Date.now(), p0: p, dir: null, off: null, ultimo: p };
    });

    window.addEventListener("pointermove", (e) => {
      if (!gesto) {
        // Mouse sin presionar: la esquina se levanta un poquito (solo si hay página siguiente)
        if (e.pointerType === "mouse" && !viajando && !enFinal()) libro.userMove(posEnBloque(e), false);
        return;
      }
      const dx = e.clientX - gesto.x0, dy = e.clientY - gesto.y0;

      if (gesto.dir === null) {
        if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
        if (Math.abs(dy) > Math.abs(dx)) { gesto = null; return; } // es scroll vertical
        const dir = dx < 0 ? "next" : "prev";
        if ((dir === "next" && enFinal()) || (dir === "prev" && paginaActual === 0)) {
          gesto.dir = "bloqueado"; // no hay hoja hacia ese lado
          return;
        }
        const w = bloque.offsetWidth, h = bloque.offsetHeight;
        const inicio = { x: dir === "next" ? w - 4 : 4, y: Math.min(Math.max(gesto.p0.y, 4), h - 4) };
        gesto.dir = dir;
        gesto.off = { x: inicio.x - gesto.p0.x, y: inicio.y - gesto.p0.y };
        libro.startUserTouch(inicio);
      }
      if (gesto.dir === "bloqueado") return;

      const p = posEnBloque(e);
      gesto.ultimo = { x: p.x + gesto.off.x, y: p.y + gesto.off.y };
      libro.userMove(gesto.ultimo, true);
      e.preventDefault();
    }, { passive: false });

    function soltar(e, cancelado) {
      if (!gesto) return;
      const g = gesto;
      gesto = null;
      if (g.dir !== "next" && g.dir !== "prev") return;

      // Un movimiento rápido termina de pasar la hoja aunque sea corto
      const dx = e.clientX - g.x0;
      const rapido = !cancelado && Date.now() - g.t0 < 350 && Math.abs(dx) > 30;
      if (rapido) {
        const w = bloque.offsetWidth;
        g.ultimo = { x: g.dir === "next" ? -w * 0.5 : w * 1.5, y: g.ultimo.y };
        libro.userMove(g.ultimo, true);
      }
      libro.userStop(g.ultimo);
    }
    window.addEventListener("pointerup", (e) => soltar(e, false));
    window.addEventListener("pointercancel", (e) => soltar(e, true));

    prevBtn.addEventListener("click", anterior);
    nextBtn.addEventListener("click", siguiente);
    endBtn.addEventListener("click", irAlFinal);

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") siguiente();
      if (e.key === "ArrowLeft") anterior();
    });

    let resizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(construirLibro, 200);
    });

    // Precarga de fotos
    for (const p of PAGINAS) {
      if (hasImage(p.image)) { const img = new Image(); img.src = p.image; }
    }

    construirLibro();


    // ==============================
    // 🔔 NEW CONTENT NOTIFICATION
    // ==============================
    
    const CONTENT_VERSION = "v8";
    
    function checkForNewContent() {
      const seenVersion = localStorage.getItem("seen_version");
    
      if (seenVersion !== CONTENT_VERSION) {
        showNewContentPopup();
        localStorage.setItem("seen_version", CONTENT_VERSION);
      }
    }
    
    function showNewContentPopup() {
      const popup = document.createElement("div");
    
      popup.textContent = "✨ Hay algo nuevo esperándote aquí, mi amor";
    
      popup.style.position = "fixed";
      popup.style.bottom = "24px";
      popup.style.left = "50%";
      popup.style.transform = "translateX(-50%) scale(0.9)";
      popup.style.padding = "14px 20px";
      popup.style.borderRadius = "14px";
      popup.style.background = "linear-gradient(135deg, #FF4D6D, #7C5CFF)";
      popup.style.color = "#fff";
      popup.style.fontWeight = "800";
      popup.style.fontSize = "14px";
      popup.style.zIndex = "99999";
      popup.style.boxShadow = "0 12px 40px rgba(0,0,0,.35)";
      popup.style.opacity = "0";
      popup.style.transition = "all 300ms ease";
    
      document.body.appendChild(popup);
    
      requestAnimationFrame(() => {
        popup.style.opacity = "1";
        popup.style.transform = "translateX(-50%) scale(1)";
      });
    
      setTimeout(() => {
        popup.style.opacity = "0";
        popup.style.transform = "translateX(-50%) scale(0.9)";
        setTimeout(() => popup.remove(), 300);
      }, 17500);
    }
    
    checkForNewContent();
  </script>

  <!-- 🎉 Celebraciones: las fechas se editan en js/celebraciones.js -->
  <script src="js/celebraciones.js"></script>
  <script src="js/efectos.js"></script>
</body>
